<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Timeline Cards</title>
  <style>
    :root {
      --text: #2C2C2B;
      --text-secondary: #7D7A75;
      --canvas: #F4F3F1;
      --surface: #FFFFFF;
      --surface-2: #F0EFED;
      --border: #E6E5E3;
      --accent: #2783DE;
      --accent-soft: #E5F2FC;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #FFFFFF;
        --text-secondary: rgba(255,255,255,.65);
        --canvas: #141414;
        --surface: #202020;
        --surface-2: #2A2A28;
        --border: rgba(255,255,255,.16);
        --accent: #5E9FE8;
        --accent-soft: rgba(94,159,232,.14);
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo { width: 22px; height: 22px; color: var(--text); flex-shrink: 0; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      appearance: none; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); border-radius: 8px; min-height: 36px; padding: 0 12px;
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
    }
    .btn:hover { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
    .btn-primary:hover { opacity: .92; color: #fff; background: var(--accent); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }
    .profile-card { margin-bottom: 16px; }
    .profile-banner {
      height: 88px;
      background: linear-gradient(135deg, rgba(39,131,222,.18), rgba(39,131,222,.02)), var(--surface-2);
      background-size: cover; background-position: center;
    }
    .profile-body {
      display: grid; grid-template-columns: 72px 1fr; gap: 12px;
      padding: 0 16px 16px; margin-top: -28px;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
      background: var(--surface-2); border: 3px solid var(--surface); box-shadow: var(--shadow);
    }
    .profile-main { padding-top: 34px; min-width: 0; }
    .profile-name { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .profile-handle { margin: 2px 0 0; color: var(--text-secondary); font-size: 13px; }
    .profile-bio {
      grid-column: 1 / -1; margin: 4px 0 0; font-size: 14px; color: var(--text);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .profile-meta { grid-column: 1 / -1; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px;
      border-radius: 999px; background: var(--surface-2); color: var(--text-secondary);
      font-size: 12px; font-weight: 600; text-decoration: none; border: 1px solid transparent;
    }
    a.chip:hover { background: var(--accent-soft); color: var(--accent); }
    .section-label {
      margin: 0 0 10px; font-size: 13px; font-weight: 700;
      color: var(--text-secondary); letter-spacing: 0.02em;
    }
    .feed { display: grid; gap: 12px; }
    .post-card {
      display: block; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
      color: var(--text); cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .post-card:hover {
      border-color: rgba(39,131,222,.35); transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,.06), 0 8px 20px rgba(0,0,0,.04);
    }
    .post-card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      .post-card:hover { border-color: rgba(94,159,232,.45); box-shadow: none; }
    }
    .post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      background: var(--surface-2); border: 1px solid var(--border); flex-shrink: 0;
    }
    .post-who { min-width: 0; flex: 1; }
    .post-who-name {
      margin: 0; font-size: 14px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .post-who-sub {
      margin: 1px 0 0; font-size: 12px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .post-time { font-size: 12px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
    .post-text {
      margin: 0; font-size: 15px; color: var(--text);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .post-text a { color: var(--accent); text-decoration: none; }
    .post-text a:hover { text-decoration: underline; }
    .media { margin-top: 12px; display: grid; gap: 8px; }
    .media.single img {
      width: 100%; max-height: 320px; object-fit: cover; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface-2);
    }
    .media.multi { grid-template-columns: 1fr 1fr; }
    .media.multi img {
      width: 100%; height: 140px; object-fit: cover; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface-2);
    }
    .post-foot {
      margin-top: 12px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .post-stats { display: flex; gap: 12px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
    .post-cta { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; }
    .post-cta:hover { text-decoration: underline; }
    .empty {
      padding: 32px 16px; text-align: center; color: var(--text-secondary); font-size: 14px;
      background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .note {
      margin-top: 16px; text-align: center; font-size: 12px;
      color: var(--text-secondary); line-height: 1.6;
    }
    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: var(--text); color: var(--canvas); padding: 10px 14px; border-radius: 999px;
      font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 420px) {
      .page { padding: 16px 12px 32px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
      .profile-body { grid-template-columns: 64px 1fr; }
      .avatar { width: 64px; height: 64px; }
      .media.multi img { height: 110px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .post-card { transition: none; }
      .post-card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.828L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
        </svg>
        <div>
          <h1>X Timeline</h1>
          <p id="updated-label">表示準備中…</p>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="refresh-profile">プロフィール更新</button>
        <a class="btn btn-primary" id="open-x" href="https://x.com/juufuuteiraden" target="_blank" rel="noopener noreferrer">Xで開く</a>
      </div>
    </div>

    <section class="card profile-card" aria-label="プロフィール">
      <div class="profile-banner" id="profile-banner"></div>
      <div class="profile-body" id="profile"></div>
    </section>

    <p class="section-label">最近の投稿</p>
    <section class="feed" id="feed" aria-label="投稿カード一覧" aria-live="polite"></section>

    <p class="note">
      簡易カード表示 · 公式埋め込み不使用<br />
      投稿本文はスナップショットです。最新は「Xで開く」から確認できます。
    </p>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
(function () {
  "use strict";

  function decodeSeedB64(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  function showToast(msg) {
    var toast = document.getElementById("toast");
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      toast.classList.remove("show");
    }, 2200);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function linkify(text) {
    var s = escapeHtml(text || "");
    s = s.replace(/(https?:\/\/[^\s<]+)/g, function (m) {
      var clean = m.replace(/[)\].,!?]+$/g, "");
      var trail = m.slice(clean.length);
      return '<a href="' + clean + '" target="_blank" rel="noopener noreferrer">' + clean + "</a>" + trail;
    });
    s = s.replace(/@([A-Za-z0-9_]+)/g, '<a href="https://x.com/$1" target="_blank" rel="noopener noreferrer">@$1</a>');
    s = s.replace(/#([0-9A-Za-z_\u00C0-\u024F\u3040-\u30FF\u3400-\u9FFF]+)/g,
      '<a href="https://x.com/hashtag/$1" target="_blank" rel="noopener noreferrer">#$1</a>');
    return s;
  }

  function formatCount(n) {
    if (n == null || n === "") return null;
    var num = Number(n);
    if (isNaN(num)) return null;
    return new Intl.NumberFormat("ja-JP").format(num);
  }

  function formatFetchedAt(iso) {
    if (!iso) return "更新日時不明";
    try {
      return "データ取得: " + new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
    } catch (e) {
      return "データ取得: " + iso;
    }
  }

  function createApp(seed) {
    var state = JSON.parse(JSON.stringify(seed));
    var profileEl = document.getElementById("profile");
    var bannerEl = document.getElementById("profile-banner");
    var feedEl = document.getElementById("feed");
    var updatedLabel = document.getElementById("updated-label");
    var openX = document.getElementById("open-x");
    var refreshBtn = document.getElementById("refresh-profile");

    function renderProfile(p) {
      p = p || {};
      var followers = formatCount(p.followers);
      var tweets = formatCount(p.tweets);
      if (bannerEl) {
        bannerEl.style.backgroundImage = p.banner_url
          ? 'url("' + String(p.banner_url).replace(/"/g, '\\"') + '")'
          : "";
      }
      profileEl.innerHTML =
        '<img class="avatar" src="' + escapeHtml(p.avatar_url || "") + '" alt="" width="72" height="72" loading="lazy" referrerpolicy="no-referrer" />' +
        '<div class="profile-main">' +
          '<p class="profile-name">' + escapeHtml(p.name || "") + "</p>" +
          '<p class="profile-handle">@' + escapeHtml(p.screen_name || "") + "</p>" +
        "</div>" +
        (p.description ? '<p class="profile-bio">' + escapeHtml(p.description) + "</p>" : "") +
        '<div class="profile-meta">' +
          (followers != null ? '<span class="chip">フォロワー ' + followers + "</span>" : "") +
          (tweets != null ? '<span class="chip">投稿 ' + tweets + "</span>" : "") +
          (p.website ? '<a class="chip" href="' + escapeHtml(p.website) + '" target="_blank" rel="noopener noreferrer">Web</a>' : "") +
        "</div>";
      openX.href = p.url || ("https://x.com/" + (p.screen_name || "juufuuteiraden"));
    }

    function bindPostCards() {
      var cards = feedEl.querySelectorAll(".post-card[data-url]");
      for (var i = 0; i < cards.length; i++) {
        (function (card) {
          card.addEventListener("click", function (e) {
            if (e.target.closest("a")) return;
            var url = card.getAttribute("data-url");
            if (url) window.open(url, "_blank", "noopener,noreferrer");
          });
          card.addEventListener("keydown", function (e) {
            if ((e.key === "Enter" || e.key === " ") && !e.target.closest("a")) {
              e.preventDefault();
              var url = card.getAttribute("data-url");
              if (url) window.open(url, "_blank", "noopener,noreferrer");
            }
          });
        })(cards[i]);
      }
    }

    function renderPosts(posts) {
      var profile = state.profile || {};
      if (!posts || !posts.length) {
        feedEl.innerHTML = '<div class="empty">表示できる投稿がありません</div>';
        return;
      }
      feedEl.innerHTML = posts.map(function (post) {
        var mediaItems = (post.media || []).filter(function (m) { return m && m.url; }).slice(0, 4);
        var mediaClass = mediaItems.length > 1 ? "media multi" : "media single";
        var media = mediaItems.map(function (m) {
          return '<img src="' + escapeHtml(m.url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" />';
        }).join("");
        var fav = formatCount(post.favorite_count);
        var rt = formatCount(post.retweet_count);
        return (
          '<article class="post-card" data-url="' + escapeHtml(post.url) + '" tabindex="0" role="link" aria-label="投稿をXで開く">' +
            '<div class="post-head">' +
              '<img class="post-avatar" src="' + escapeHtml(profile.avatar_url || "") + '" alt="" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" />' +
              '<div class="post-who">' +
                '<p class="post-who-name">' + escapeHtml(profile.name || "") + "</p>" +
                '<p class="post-who-sub">@' + escapeHtml(profile.screen_name || "") + "</p>" +
              "</div>" +
              '<span class="post-time">' + escapeHtml(post.created_label || post.created_at || "") + "</span>" +
            "</div>" +
            '<p class="post-text">' + linkify(post.text || "") + "</p>" +
            (media ? '<div class="' + mediaClass + '">' + media + "</div>" : "") +
            '<div class="post-foot">' +
              '<div class="post-stats">' +
                (rt != null ? "<span>RT " + rt + "</span>" : "") +
                (fav != null ? "<span>いいね " + fav + "</span>" : "") +
              "</div>" +
              '<a class="post-cta" href="' + escapeHtml(post.url) + '" target="_blank" rel="noopener noreferrer">投稿を見る →</a>' +
            "</div>" +
          "</article>"
        );
      }).join("");
      bindPostCards();
    }

    function renderAll() {
      renderProfile(state.profile || {});
      renderPosts(state.posts || []);
      updatedLabel.textContent = formatFetchedAt(state.fetched_at);
    }

    function refreshProfile(opts) {
      opts = opts || {};
      var silent = !!opts.silent;
      var username = (state.username || "juufuuteiraden").replace(/^@/, "");
      refreshBtn.disabled = true;
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 8000);
      fetch("https://api.fxtwitter.com/" + encodeURIComponent(username), {
        headers: { Accept: "application/json" },
        signal: ctrl.signal
      }).then(function (res) {
        clearTimeout(timer);
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      }).then(function (json) {
        if (!json || !json.user) throw new Error("no user");
        var u = json.user;
        state.profile = {
          name: u.name || state.profile.name,
          screen_name: u.screen_name || username,
          description: u.description || "",
          avatar_url: (u.avatar_url || "").replace("_normal", "_bigger"),
          banner_url: u.banner_url || "",
          url: u.url || ("https://x.com/" + username),
          followers: u.followers,
          tweets: u.tweets,
          website: u.website && u.website.url ? u.website.url : (u.website || null)
        };
        renderProfile(state.profile);
        renderPosts(state.posts || []);
        if (!silent) showToast("プロフィールを更新しました");
      }).catch(function () {
        if (!silent) showToast("プロフィール更新に失敗しました");
      }).finally(function () {
        refreshBtn.disabled = false;
      });
    }

    refreshBtn.addEventListener("click", function () {
      refreshProfile({ silent: false });
    });

    renderAll();
    refreshProfile({ silent: true });
  }

  function fail(msg) {
    var updatedLabel = document.getElementById("updated-label");
    var feedEl = document.getElementById("feed");
    if (updatedLabel) updatedLabel.textContent = "表示エラー";
    if (feedEl) feedEl.innerHTML = '<div class="empty">' + escapeHtml(msg) + "</div>";
  }

  function boot(seed) {
    try {
      createApp(seed);
    } catch (e) {
      console.error(e);
      fail("表示に失敗しました。ページを再読み込みしてください。");
    }
  }

  // 1) data.json を優先  2) だめなら埋め込みSEED
  var embedded = null;
  try {
    if (window.__TIMELINE_SEED_B64__) {
      embedded = decodeSeedB64(window.__TIMELINE_SEED_B64__);
    }
  } catch (e) {
    console.warn("embedded seed decode failed", e);
  }

  fetch("./data.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("data.json http " + res.status);
      return res.json();
    })
    .then(function (json) { boot(json); })
    .catch(function (err) {
      console.warn("data.json load failed, fallback to embedded", err);
      if (embedded) boot(embedded);
      else fail("data.json を読み込めません。同じフォルダに data.json があるか確認してください。");
    });
})();

  </script>
</body>
</html>
