<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Timeline</title>
  <style>
    :root {
      --text: #2C2C2B;
      --text-secondary: #7D7A75;
      --canvas: #FFFFFF;
      --surface: #F9F8F7;
      --border: #E6E5E3;
      --accent: #2783DE;
      --accent-soft: #E5F2FC;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #FFFFFF;
        --text-secondary: rgba(255, 255, 255, 0.65);
        --canvas: #191919;
        --surface: #202020;
        --border: rgba(255, 255, 255, 0.20);
        --accent: #5E9FE8;
        --accent-soft: rgba(94, 159, 232, 0.12);
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--canvas);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 32px;
    }

    .widget {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: var(--text);
    }

    .header-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .themes {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--canvas);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .chip:hover,
    .chip[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }

    .timeline-shell {
      position: relative;
      width: 100%;
      min-height: 600px;
      background: var(--canvas);
    }

    #timeline {
      width: 100%;
      min-height: 600px;
    }

    /* 変換前の仮リンクだけ隠す（変換後の .twitter-timeline-rendered には当てない） */
    a.twitter-timeline {
      display: block;
      width: 100%;
      min-height: 600px;
      color: transparent;
      font-size: 0;
      line-height: 0;
      overflow: hidden;
    }

    /* widgets.js が作るラッパー／iframe を確実に表示 */
    #timeline .twitter-timeline-rendered {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      min-height: 600px !important;
    }

    #timeline iframe {
      display: block !important;
      visibility: visible !important;
      width: 100% !important;
      min-width: 100% !important;
      min-height: 600px !important;
    }

    .state {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 32px 24px;
      text-align: center;
      pointer-events: none;
      background: var(--canvas);
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    .state.is-visible { display: flex; }
    .state.is-success-hidden {
      display: none !important;
      background: transparent;
    }

    .state strong {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }

    .state-body {
      max-width: 300px;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }

    .hint a {
      color: var(--accent);
      text-decoration: none;
    }

    .hint a:hover { text-decoration: underline; }

    @media (max-width: 420px) {
      .page { padding: 16px 12px 24px; }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="widget" aria-label="Xタイムラインウィジェット">
      <header class="header">
        <div class="brand">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.828L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
          </svg>
          <div class="header-text">
            <h1>X Timeline</h1>
          </div>
        </div>
        <div class="themes" role="group" aria-label="表示テーマ">
          <button type="button" class="chip" data-theme="light" aria-pressed="false">ライト</button>
          <button type="button" class="chip" data-theme="dark" aria-pressed="false">ダーク</button>
          <button type="button" class="chip" data-theme="auto" aria-pressed="true">自動</button>
        </div>
      </header>

      <div class="timeline-shell">
        <div id="state" class="state" aria-live="polite"></div>
        <div id="timeline"></div>
      </div>
    </section>
    <p class="hint">
      公式埋め込みを使用 ·
      <a id="profile-link" href="https://x.com/juufuuteiraden" target="_blank" rel="noopener noreferrer">プロフィールを開く</a>
    </p>
  </main>

  <script>
    (function () {
      // ===== 設定（ここだけ変更） =====
      const CONFIG = {
        username: "juufuuteiraden",
        height: 600,
        theme: "auto" // light | dark | auto
      };
      // ==============================

      const timeline = document.getElementById("timeline");
      const state = document.getElementById("state");
      const profileLink = document.getElementById("profile-link");
      const chips = Array.from(document.querySelectorAll(".chip[data-theme]"));

      let theme = CONFIG.theme || "auto";
      let loadToken = 0;

      function normalizeUsername(raw) {
        if (!raw) return "";
        let value = String(raw).trim();
        value = value.replace(/^@+/, "");
        value = value.replace(/^https?:\/\/(www\.)?(twitter|x)\.com\//i, "");
        value = value.split(/[/?#]/)[0];
        return value.replace(/[^A-Za-z0-9_]/g, "");
      }

      function resolveChrome() {
        if (theme === "dark") return "dark";
        if (theme === "light") return "light";
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function setState(title, body, opts) {
        opts = opts || {};
        if (!title) {
          state.classList.remove("is-visible");
          state.classList.add("is-success-hidden");
          state.innerHTML = "";
          return;
        }
        state.classList.remove("is-success-hidden");
        state.innerHTML =
          "<strong>" + title + "</strong>" +
          (body ? '<span class="state-body">' + body + "</span>" : "");
        state.classList.add("is-visible");
        if (opts.blocking === false) {
          state.style.background = "transparent";
        } else {
          state.style.background = "";
        }
      }

      function loadWidgetsScript() {
        return new Promise(function (resolve, reject) {
          if (window.twttr && window.twttr.widgets && window.twttr.ready) {
            window.twttr.ready(resolve);
            return;
          }
          var existing = document.querySelector('script[data-x-widgets="1"]');
          if (existing) {
            existing.addEventListener("load", function () {
              if (window.twttr && window.twttr.ready) window.twttr.ready(resolve);
              else resolve();
            });
            existing.addEventListener("error", reject);
            return;
          }
          var script = document.createElement("script");
          script.src = "https://platform.twitter.com/widgets.js";
          script.async = true;
          script.charset = "utf-8";
          script.setAttribute("data-x-widgets", "1");
          script.onload = function () {
            if (window.twttr && window.twttr.ready) window.twttr.ready(resolve);
            else resolve();
          };
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      function waitForVisibleIframe(root, token, timeoutMs) {
        return new Promise(function (resolve) {
          var started = Date.now();

          function check() {
            if (token !== loadToken) return resolve(false);
            var iframe = root.querySelector("iframe");
            if (iframe) {
              var w = iframe.offsetWidth || parseInt(iframe.style.width, 10) || 0;
              var h = iframe.offsetHeight || parseInt(iframe.style.height, 10) || 0;
              // widgets.js は後から高さを入れることがある
              if (w > 0 && h > 40) return resolve(true);
              iframe.style.visibility = "visible";
              iframe.style.display = "block";
              if (!iframe.style.minHeight) iframe.style.minHeight = CONFIG.height + "px";
              if ((iframe.offsetWidth > 0) && (iframe.offsetHeight > 40 || CONFIG.height)) {
                // 強制表示して成功扱いに近づける
                if (iframe.offsetHeight < 40) iframe.style.height = CONFIG.height + "px";
                if (iframe.offsetWidth > 0 && (iframe.offsetHeight > 40 || parseInt(iframe.style.height, 10) >= 40)) {
                  return resolve(true);
                }
              }
            }
            if (Date.now() - started >= timeoutMs) return resolve(!!iframe);
            requestAnimationFrame(check);
          }
          check();
        });
      }

      function renderTimeline(username) {
        var token = ++loadToken;
        timeline.innerHTML = "";
        setState("読み込み中…", "タイムラインを取得しています");

        profileLink.href = "https://x.com/" + encodeURIComponent(username);
        profileLink.textContent = "@" + username + " を開く";

        var link = document.createElement("a");
        link.className = "twitter-timeline";
        link.href = "https://twitter.com/" + encodeURIComponent(username) + "?ref_src=twsrc%5Etfw";
        link.setAttribute("data-height", String(CONFIG.height || 600));
        link.setAttribute("data-width", "100%");
        // transparent を外して高さ計算を安定させる
        link.setAttribute("data-chrome", "noheader nofooter noborders");
        link.setAttribute("data-theme", resolveChrome());
        link.setAttribute("data-lang", "ja");
        link.textContent = "Posts by @" + username;
        timeline.appendChild(link);

        loadWidgetsScript()
          .then(function () {
            if (token !== loadToken) return null;
            if (!(window.twttr && window.twttr.widgets)) {
              throw new Error("widgets missing");
            }
            return window.twttr.widgets.load(timeline);
          })
          .then(function () {
            if (token !== loadToken) return;
            return waitForVisibleIframe(timeline, token, 8000);
          })
          .then(function (ok) {
            if (token !== loadToken) return;
            if (ok) {
              setState(null);
              return;
            }
            setState(
              "タイムラインを表示できませんでした",
              "広告ブロック／トラッキング防止、またはX側の一時障害の可能性があります。下のリンクからプロフィールを開けます。"
            );
          })
          .catch(function () {
            if (token !== loadToken) return;
            setState(
              "読み込みに失敗しました",
              "インターネット接続と、ブラウザのトラッキング防止設定を確認してください。"
            );
          });
      }

      function applyThemeChips() {
        chips.forEach(function (c) {
          c.setAttribute(
            "aria-pressed",
            String(c.getAttribute("data-theme") === theme)
          );
        });
      }

      chips.forEach(function (chip) {
        chip.addEventListener("click", function () {
          theme = chip.getAttribute("data-theme");
          applyThemeChips();
          try { localStorage.setItem("x-timeline-theme", theme); } catch (e) {}
          var username = normalizeUsername(CONFIG.username);
          if (username) renderTimeline(username);
        });
      });

      try {
        var savedTheme = localStorage.getItem("x-timeline-theme");
        if (savedTheme && ["light", "dark", "auto"].indexOf(savedTheme) >= 0) {
          theme = savedTheme;
        }
      } catch (e) {}

      applyThemeChips();

      var username = normalizeUsername(CONFIG.username);
      if (!username) {
        setState("設定エラー", "CONFIG.username にユーザー名を入れてください");
        return;
      }
      renderTimeline(username);
    })();
  </script>
</body>
</html>
