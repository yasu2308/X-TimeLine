<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Timeline Cards</title>
  <style>
    :root {
      --text: #2C2C2B;
      --text-secondary: #7D7A75;
      --canvas: #F4F3F1;
      --surface: #FFFFFF;
      --surface-2: #F0EFED;
      --border: #E6E5E3;
      --accent: #2783DE;
      --accent-soft: #E5F2FC;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #FFFFFF;
        --text-secondary: rgba(255,255,255,.65);
        --canvas: #141414;
        --surface: #202020;
        --surface-2: #2A2A28;
        --border: rgba(255,255,255,.16);
        --accent: #5E9FE8;
        --accent-soft: rgba(94,159,232,.14);
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo { width: 22px; height: 22px; color: var(--text); flex-shrink: 0; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; justify-content: flex-end; }
    .btn {
      appearance: none; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); border-radius: 8px; min-height: 36px; padding: 0 12px;
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
    }
    .btn:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .92; color: #fff; background: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .profile-card { margin-bottom: 16px; }
    .profile-banner {
      height: 88px;
      background: linear-gradient(135deg, rgba(39,131,222,.18), rgba(39,131,222,.02)), var(--surface-2);
      background-size: cover; background-position: center;
    }
    .profile-body { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 0 16px 16px; margin-top: -28px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--surface-2); border: 3px solid var(--surface); box-shadow: var(--shadow); }
    .profile-main { padding-top: 34px; min-width: 0; }
    .profile-name { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .profile-handle { margin: 2px 0 0; color: var(--text-secondary); font-size: 13px; }
    .profile-bio { grid-column: 1 / -1; margin: 4px 0 0; font-size: 14px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
    .profile-meta { grid-column: 1 / -1; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 999px;
      background: var(--surface-2); color: var(--text-secondary); font-size: 12px; font-weight: 600; text-decoration: none;
    }
    a.chip:hover { background: var(--accent-soft); color: var(--accent); }
    .section-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
    .section-label { margin: 0; font-size: 13px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.02em; }
    .feed { display: grid; gap: 12px; }
    .post-card {
      display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px; color: var(--text); cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .post-card:hover { border-color: rgba(39,131,222,.35); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.06), 0 8px 20px rgba(0,0,0,.04); }
    .post-card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      .post-card:hover { border-color: rgba(94,159,232,.45); box-shadow: none; }
    }
    .post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--surface-2); border: 1px solid var(--border); flex-shrink: 0; }
    .post-who { min-width: 0; flex: 1; }
    .post-who-name { margin: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-who-sub { margin: 1px 0 0; font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-time { font-size: 12px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
    .post-text { margin: 0; font-size: 15px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
    .post-text a { color: var(--accent); text-decoration: none; }
    .post-text a:hover { text-decoration: underline; }
    .media { margin-top: 12px; display: grid; gap: 8px; }
    .media.single img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
    .media.multi { grid-template-columns: 1fr 1fr; }
    .media.multi img { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
    .post-foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .post-stats { display: flex; gap: 12px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
    .post-cta { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; }
    .post-cta:hover { text-decoration: underline; }
    .empty { padding: 32px 16px; text-align: center; color: var(--text-secondary); font-size: 14px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
    .note { margin-top: 16px; text-align: center; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: var(--text); color: var(--canvas); padding: 10px 14px; border-radius: 999px;
      font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 20; max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; }
    @media (max-width: 420px) {
      .page { padding: 16px 12px 32px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
      .profile-body { grid-template-columns: 64px 1fr; }
      .avatar { width: 64px; height: 64px; }
      .media.multi img { height: 110px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .post-card { transition: none; }
      .post-card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.828L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
        </svg>
        <div>
          <h1>X Timeline</h1>
          <p id="updated-label">表示準備中…</p>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="refresh-posts">投稿を更新</button>
        <a class="btn btn-primary" id="open-x" href="https://x.com/juufuuteiraden" target="_blank" rel="noopener noreferrer">Xで開く</a>
      </div>
    </div>

    <section class="card profile-card" aria-label="プロフィール">
      <div class="profile-banner" id="profile-banner"></div>
      <div class="profile-body" id="profile"></div>
    </section>

    <div class="section-row">
      <p class="section-label">最近の投稿</p>
    </div>
    <section class="feed" id="feed" aria-label="投稿カード一覧" aria-live="polite"></section>

    <p class="note">
      簡易カード表示 · 「投稿を更新」で最新を再取得できます<br />
      取得できないときは保存済みデータを表示します
    </p>
  </main>
  <div class="toast" id="toast" role="status"></div>

    var num = Number(n);
    if (isNaN(num)) return null;
    return new Intl.NumberFormat("ja-JP").format(num);
  }

  function formatFetchedAt(iso) {
    if (!iso) return "更新日時不明";
    try {
      return "データ取得: " + new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
    } catch (e) {
      return "データ取得: " + iso;
    }
  }

  function parseRssDate(pub) {
    var d = new Date(pub);
    if (!isNaN(d.getTime())) return d;
    return null;
  }

  function toPostFromRssItem(item) {
    var title = (item.querySelector("title") && item.querySelector("title").textContent) || "";
    var link = (item.querySelector("link") && item.querySelector("link").textContent) || "";
    var pub = (item.querySelector("pubDate") && item.querySelector("pubDate").textContent) || "";
    var desc = (item.querySelector("description") && item.querySelector("description").textContent) || "";
    var tmp = document.createElement("div");
    tmp.innerHTML = desc;
    var imgs = [];
    tmp.querySelectorAll("img").forEach(function (img) {
      var u = img.getAttribute("src");
      if (!u) return;
      if (u.indexOf("profile_images") >= 0) return;
      if (u.indexOf("//") === 0) u = "https:" + u;
      imgs.push({ type: "photo", url: u, expanded_url: u });
    });
    var text = (tmp.textContent || "").replace(/\n{3,}/g, "\n\n").trim() || title;
    var m = link.match(/status(?:es)?\/(\d+)/);
    var id = m ? m[1] : "";
    var dt = parseRssDate(pub);
    return {
      id: id,
      created_at: pub,
      created_iso: dt ? dt.toISOString() : "",
      created_label: dt ? dt.toLocaleString("ja-JP", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false
      }).replace(/\//g, "/").replace(", ", " ") : pub,
      text: text,
      url: id ? ("https://x.com/" + USERNAME + "/status/" + id) : ("https://x.com/" + USERNAME),
      media: imgs,
      favorite_count: null,
      retweet_count: null,
      _sort: dt ? dt.getTime() : 0
    };
  }

  function parseRssXml(xmlText) {
    var doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.querySelector("parsererror")) throw new Error("RSS parse error");
    var items = Array.prototype.slice.call(doc.querySelectorAll("item"));
    var posts = items.map(parseRssFromItemSafe).filter(Boolean);
    return posts;

    function parseRssFromItemSafe(item) {
      try { return toPostFromRssItem(item); } catch (e) { return null; }
    }
  }

  function parseJinaMarkdown(md) {
    // ### [title](url)\n\nurl\nDate
    var posts = [];
    var re = /###\s*\[([^\]]*)\]\(([^)]+)\)[\s\S]*?(?:GMT|UTC|\d{4})[^\n]*/g;
    var blocks = md.split(/\n###\s+/);
    blocks.forEach(function (block, idx) {
      var text = idx === 0 ? block : ("### " + block);
      var titleMatch = text.match(/###\s*\[([^\]]*)\]\(([^)]+)\)/);
      if (!titleMatch) return;
      var title = titleMatch[1];
      var link = titleMatch[2];
      var idMatch = link.match(/status(?:es)?\/(\d+)/);
      var id = idMatch ? idMatch[1] : "";
      var dateMatch = text.match(/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun),[^<\n]+(?:GMT|UTC)/);
      var pub = dateMatch ? dateMatch[0] : "";
      var dt = parseRssDate(pub);
      // body: after date line
      var body = text.replace(/###\s*\[[^\]]*\]\([^)]+\)/, "").replace(link, "");
      if (pub) body = body.replace(pub, "");
      body = body.replace(/https?:\/\/\S+/g, function (u) {
        // keep non-status urls maybe
        if (/status(?:es)?\/\d+/.test(u)) return "";
        return u;
      }).replace(/\n{3,}/g, "\n\n").trim();
      if (!body) body = title.replace(/^RT by @[^:]+:\s*/, "");
      posts.push({
        id: id,
        created_at: pub,
        created_iso: dt ? dt.toISOString() : "",
        created_label: dt ? dt.toLocaleString("ja-JP", {
          timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", hour12: false
        }).replace(", ", " ") : pub,
        text: body,
        url: id ? ("https://x.com/" + USERNAME + "/status/" + id) : ("https://x.com/" + USERNAME),
        media: [],
        favorite_count: null,
        retweet_count: null,
        _sort: dt ? dt.getTime() : 0
      });
    });
    return posts;
  }

  async function fetchText(url, timeoutMs) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, timeoutMs || 15000);
    try {
      var res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      return await res.text();
    } finally {
      clearTimeout(t);
    }
  }

  async function fetchLatestPosts() {
    var errors = [];
    // 1) direct RSS
    for (var i = 0; i < RSS_URLS.length; i++) {
      try {
        var xml = await fetchText(RSS_URLS[i], 12000);
        if (xml.indexOf("<item") >= 0) {
          var posts = parseRssXml(xml);
          if (posts.length) return finalizePosts(posts);
        }
      } catch (e) { errors.push("rss:" + e.message); }
    }
    // 2) jina markdown bridge (CORS OK)
    for (var j = 0; j < RSS_URLS.length; j++) {
      try {
        var md = await fetchText("https://r.jina.ai/http://" + RSS_URLS[j].replace(/^https?:\/\//, ""), 20000);
        var posts2 = parseJinaMarkdown(md);
        if (posts2.length) return finalizePosts(posts2);
      } catch (e) { errors.push("jina:" + e.message); }
    }
    throw new Error(errors.join(" / ") || "fetch failed");
  }

  function finalizePosts(posts) {
    var seen = {};
    var out = [];
    posts.sort(function (a, b) { return (b._sort || 0) - (a._sort || 0); });
    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      if (!p.id || seen[p.id]) continue;
      seen[p.id] = true;
      delete p._sort;
      out.push(p);
      if (out.length >= 12) break;
    }
    return out;
  }

  async function enrichPosts(posts) {
    // fxtwitter is CORS * ; enrich first few for media/likes
    var limit = Math.min(posts.length, 8);
    var tasks = [];
    for (var i = 0; i < limit; i++) {
      (function (idx) {
        tasks.push(
          fetch("https://api.fxtwitter.com/status/" + encodeURIComponent(posts[idx].id), {
            headers: { Accept: "application/json" }
          }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
            if (!j || !j.tweet) return;
            var tw = j.tweet;
            if (tw.text) posts[idx].text = tw.text;
            if (tw.likes != null) posts[idx].favorite_count = tw.likes;
            if (tw.retweets != null) posts[idx].retweet_count = tw.retweets;
            var media = [];
            var m = tw.media || {};
            (m.photos || []).forEach(function (ph) {
              var u = typeof ph === "string" ? ph : (ph && ph.url);
              if (u) media.push({ type: "photo", url: u, expanded_url: u });
            });
            (m.videos || []).forEach(function (v) {
              var u = v && (v.thumbnail_url || v.url);
              if (u) media.push({ type: "video", url: u, expanded_url: u });
            });
            if (Array.isArray(tw.gallery)) {
              tw.gallery.forEach(function (g) {
                var u = g && (g.url || g.thumbnail_url);
                if (u) media.push({ type: g.type || "photo", url: u, expanded_url: u });
              });
            }
            if (media.length) posts[idx].media = media;
          }).catch(function () {})
        );
      })(i);
    }
    await Promise.all(tasks);
    return posts;
  }

  function createApp(seed) {
    var state = JSON.parse(JSON.stringify(seed));
    var profileEl = document.getElementById("profile");
    var bannerEl = document.getElementById("profile-banner");
    var feedEl = document.getElementById("feed");
    var updatedLabel = document.getElementById("updated-label");
    var openX = document.getElementById("open-x");
    var refreshProfileBtn = document.getElementById("refresh-profile");
    var refreshPostsBtn = document.getElementById("refresh-posts");

    function saveLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function renderProfile(p) {
      p = p || {};
      var followers = formatCount(p.followers);
      var tweets = formatCount(p.tweets);
      if (bannerEl) {
        bannerEl.style.backgroundImage = p.banner_url ? ('url("' + String(p.banner_url).replace(/"/g, '\\"') + '")') : "";
      }
      profileEl.innerHTML =
        '<img class="avatar" src="' + escapeHtml(p.avatar_url || "") + '" alt="" width="72" height="72" loading="lazy" referrerpolicy="no-referrer" />' +
        '<div class="profile-main">' +
          '<p class="profile-name">' + escapeHtml(p.name || "") + "</p>" +
          '<p class="profile-handle">@' + escapeHtml(p.screen_name || "") + "</p>" +
        "</div>" +
        (p.description ? '<p class="profile-bio">' + escapeHtml(p.description) + "</p>" : "") +
        '<div class="profile-meta">' +
          (followers != null ? '<span class="chip">フォロワー ' + followers + "</span>" : "") +
          (tweets != null ? '<span class="chip">投稿 ' + tweets + "</span>" : "") +
          (p.website ? '<a class="chip" href="' + escapeHtml(p.website) + '" target="_blank" rel="noopener noreferrer">Web</a>' : "") +
        "</div>";
      openX.href = p.url || ("https://x.com/" + (p.screen_name || USERNAME));
    }

    function bindPostCards() {
      var cards = feedEl.querySelectorAll(".post-card[data-url]");
      for (var i = 0; i < cards.length; i++) {
        (function (card) {
          card.addEventListener("click", function (e) {
            if (e.target.closest("a")) return;
            var url = card.getAttribute("data-url");
            if (url) window.open(url, "_blank", "noopener,noreferrer");
          });
          card.addEventListener("keydown", function (e) {
            if ((e.key === "Enter" || e.key === " ") && !e.target.closest("a")) {
              e.preventDefault();
              var url = card.getAttribute("data-url");
              if (url) window.open(url, "_blank", "noopener,noreferrer");
            }
          });
        })(cards[i]);
      }
    }

    function renderPosts(posts) {
      var profile = state.profile || {};
      if (!posts || !posts.length) {
        feedEl.innerHTML = '<div class="empty">表示できる投稿がありません</div>';
        return;
      }
      feedEl.innerHTML = posts.map(function (post) {
        var mediaItems = (post.media || []).filter(function (m) { return m && m.url; }).slice(0, 4);
        var mediaClass = mediaItems.length > 1 ? "media multi" : "media single";
        var media = mediaItems.map(function (m) {
          return '<img src="' + escapeHtml(m.url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" />';
        }).join("");
        var fav = formatCount(post.favorite_count);
        var rt = formatCount(post.retweet_count);
        return (
          '<article class="post-card" data-url="' + escapeHtml(post.url) + '" tabindex="0" role="link" aria-label="投稿をXで開く">' +
            '<div class="post-head">' +
              '<img class="post-avatar" src="' + escapeHtml(profile.avatar_url || "") + '" alt="" width="40" height="40" loading="lazy" referrerpolicy="no-referrer" />' +
              '<div class="post-who">' +
                '<p class="post-who-name">' + escapeHtml(profile.name || "") + "</p>" +
                '<p class="post-who-sub">@' + escapeHtml(profile.screen_name || "") + "</p>" +
              "</div>" +
              '<span class="post-time">' + escapeHtml(post.created_label || post.created_at || "") + "</span>" +
            "</div>" +
            '<p class="post-text">' + linkify(post.text || "") + "</p>" +
            (media ? '<div class="' + mediaClass + '">' + media + "</div>" : "") +
            '<div class="post-foot">' +
              '<div class="post-stats">' +
                (rt != null ? "<span>RT " + rt + "</span>" : "") +
                (fav != null ? "<span>いいね " + fav + "</span>" : "") +
              "</div>" +
              '<a class="post-cta" href="' + escapeHtml(post.url) + '" target="_blank" rel="noopener noreferrer">投稿を見る →</a>' +
            "</div>" +
          "</article>"
        );
      }).join("");
      bindPostCards();
    }

    function renderAll() {
      renderProfile(state.profile || {});
      renderPosts(state.posts || []);
      updatedLabel.textContent = formatFetchedAt(state.fetched_at);
    }

    function refreshProfile(opts) {
      opts = opts || {};
      var silent = !!opts.silent;
      if (refreshProfileBtn) refreshProfileBtn.disabled = true;
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 8000);
      fetch("https://api.fxtwitter.com/" + encodeURIComponent(USERNAME), {
        headers: { Accept: "application/json" },
        signal: ctrl.signal
      }).then(function (res) {
        clearTimeout(timer);
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      }).then(function (json) {
        if (!json || !json.user) throw new Error("no user");
        var u = json.user;
        state.profile = {
          name: u.name || state.profile.name,
          screen_name: u.screen_name || USERNAME,
          description: u.description || "",
          avatar_url: (u.avatar_url || "").replace("_normal", "_bigger"),
          banner_url: u.banner_url || "",
          url: u.url || ("https://x.com/" + USERNAME),
          followers: u.followers,
          tweets: u.tweets,
          website: u.website && u.website.url ? u.website.url : (u.website || null)
        };
        renderProfile(state.profile);
        renderPosts(state.posts || []);
        saveLocal();
        if (!silent) showToast("プロフィールを更新しました");
      }).catch(function () {
        if (!silent) showToast("プロフィール更新に失敗しました");
      }).finally(function () {
        if (refreshProfileBtn) refreshProfileBtn.disabled = false;
      });
    }

    function refreshPosts(opts) {
      opts = opts || {};
      var silent = !!opts.silent;
      refreshPostsBtn.disabled = true;
      if (!silent) showToast("投稿を取得中…");
      fetchLatestPosts()
        .then(function (posts) { return enrichPosts(posts); })
        .then(function (posts) {
          if (!posts.length) throw new Error("empty");
          state.posts = posts;
          state.fetched_at = new Date().toISOString();
          renderAll();
          saveLocal();
          if (!silent) showToast("投稿を更新しました（" + posts.length + "件）");
        })
        .catch(function (e) {
          console.warn(e);
          if (!silent) showToast("投稿の更新に失敗しました。しばらくして再試行してください");
        })
        .finally(function () {
          refreshPostsBtn.disabled = false;
        });
    }

    if (refreshProfileBtn) refreshProfileBtn.addEventListener("click", function () { refreshProfile({ silent: false }); });
    refreshPostsBtn.addEventListener("click", function () { refreshPosts({ silent: false }); });

    renderAll();
    refreshProfile({ silent: true });
  }

  function boot(seed) {
    try { createApp(seed); }
    catch (e) {
      console.error(e);
      document.getElementById("updated-label").textContent = "表示エラー";
      document.getElementById("feed").innerHTML = '<div class="empty">表示に失敗しました。ページを再読み込みしてください。</div>';
    }
  }

  // load order: localStorage -> embedded seed
  var seed = null;
  try {
    var cached = localStorage.getItem(STORAGE_KEY);
    if (cached) seed = JSON.parse(cached);
  } catch (e) {}
  if (!seed || !seed.posts || !seed.posts.length) {
    try { seed = decodeSeedB64(window.__TIMELINE_SEED_B64__); }
    catch (e) { seed = { username: USERNAME, profile: {}, posts: [], fetched_at: null }; }
  }
  boot(seed);
})();
  </script>
