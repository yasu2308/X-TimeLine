<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Timeline 簡易版 v2</title>
  <style>
    :root {
      --text: #2C2C2B;
      --text-secondary: #7D7A75;
      --canvas: #FFFFFF;
      --surface: #F9F8F7;
      --surface-2: #F0EFED;
      --border: #E6E5E3;
      --accent: #2783DE;
      --accent-soft: #E5F2FC;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #FFFFFF;
        --text-secondary: rgba(255,255,255,.65);
        --canvas: #191919;
        --surface: #202020;
        --surface-2: #383836;
        --border: rgba(255,255,255,.20);
        --accent: #5E9FE8;
        --accent-soft: rgba(94,159,232,.12);
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .widget {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo { width: 22px; height: 22px; color: var(--text); flex-shrink: 0; }
    .header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .header .sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--canvas);
      color: var(--text-secondary);
      border-radius: var(--radius);
      min-height: 32px;
      padding: 0 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { opacity: .92; color: #fff; background: var(--accent); }
    .profile {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--canvas);
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .profile-name {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .profile-handle {
      margin: 2px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .profile-bio {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .profile-meta {
      margin: 8px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .feed {
      background: var(--canvas);
      max-height: min(70vh, 720px);
      overflow: auto;
    }
    a.post {
      display: block;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text) !important;
      text-decoration: none !important;
      transition: background .12s ease;
    }
    a.post:visited, a.post:hover, a.post:active {
      color: var(--text) !important;
      text-decoration: none !important;
    }
    a.post:hover { background: var(--surface); }
    .post-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .post-time {
      color: var(--text-secondary);
      font-size: 12px;
      white-space: nowrap;
    }
    .post-text {
      margin: 0;
      font-size: 15px;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .post-text a {
      color: var(--accent);
      text-decoration: none;
    }
    .post-text a:hover { text-decoration: underline; }
    .media {
      margin-top: 10px;
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }
    .media img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
    }
    .post-stats {
      margin-top: 10px;
      display: flex;
      gap: 14px;
      color: var(--text-secondary);
      font-size: 12px;
    }
    .footer {
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      background: var(--surface);
    }
    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--canvas);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 420px) {
      .page { padding: 16px 12px 32px; }
      .header { flex-direction: column; align-items: flex-start; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
    }
  </style>
</head>

    const profileEl = document.getElementById('profile');
    const feedEl = document.getElementById('feed');
    const updatedLabel = document.getElementById('updated-label');
    const openX = document.getElementById('open-x');
    const toast = document.getElementById('toast');
    const refreshBtn = document.getElementById('refresh-profile');
​
    let state = structuredClone(SEED);
​
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }
​
    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
​
    function linkify(text) {
      let s = escapeHtml(text || '');
      // URLs
      s = s.replace(/(https?:\/\/[^\s<]+)/g, (m) => {
        const clean = m.replace(/[)\].,!?]+$/g, '');
        const trail = m.slice(clean.length);
        return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>${trail}`;
      });
      // mentions
      s = s.replace(/@([A-Za-z0-9_]+)/g, '<a href="https://x.com/$1" target="_blank" rel="noopener noreferrer">@$1</a>');
      // hashtags
      s = s.replace(/#([\w\u00C0-\u024F\u3040-\u30FF\u3400-\u9FFF\uFF10-\uFF19\uFF21-\uFF3A\uFF41-\uFF5A]+)/g,
        '<a href="https://x.com/hashtag/$1" target="_blank" rel="noopener noreferrer">#$1</a>');
      return s;
    }
​
    function formatCount(n) {
      if (n == null || n === '') return null;
      const num = Number(n);
      if (Number.isNaN(num)) return null;
      return new Intl.NumberFormat('ja-JP').format(num);
    }
​
    function formatFetchedAt(iso) {
      if (!iso) return '更新日時不明';
      try {
        const d = new Date(iso);
        return 'データ取得: ' + d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
      } catch {
        return 'データ取得: ' + iso;
      }
    }
​
    function renderProfile(p) {
      const followers = formatCount(p.followers);
      const tweets = formatCount(p.tweets);
      profileEl.innerHTML = `
        <img class="avatar" src="${escapeHtml(p.avatar_url || '')}" alt="" width="56" height="56" loading="lazy" referrerpolicy="no-referrer" />
        <div>
          <p class="profile-name">${escapeHtml(p.name || '')}</p>
          <p class="profile-handle">@${escapeHtml(p.screen_name || '')}</p>
          ${p.description ? `<p class="profile-bio">${escapeHtml(p.description)}</p>` : ''}
          <div class="profile-meta">
            ${followers != null ? `<span>フォロワー ${followers}</span>` : ''}
            ${tweets != null ? `<span>投稿 ${tweets}</span>` : ''}
            ${p.website ? `<a class="btn" style="min-height:24px;padding:0 8px" href="${escapeHtml(p.website)}" target="_blank" rel="noopener noreferrer">Web</a>` : ''}
          </div>
        </div>
      `;
      openX.href = p.url || `https://x.com/${p.screen_name || 'juufuuteiraden'}`;
    }
​
    function renderPosts(posts) {
      if (!posts || !posts.length) {
        feedEl.innerHTML = '<div class="empty">表示できる投稿がありません</div>';
        return;
      }
      feedEl.innerHTML = posts.map((post) => {
        const media = (post.media || [])
          .filter((m) => m && m.url)
          .slice(0, 4)
          .map((m) => `<img src="${escapeHtml(m.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" />`)
          .join('');
        const fav = formatCount(post.favorite_count);
        const rt = formatCount(post.retweet_count);
        return `
          <a class="post" href="${escapeHtml(post.url)}" target="_blank" rel="noopener noreferrer">
            <div class="post-top">
              <span class="post-time">${escapeHtml(post.created_label || post.created_at || '')}</span>
            </div>
            <p class="post-text">${linkify(post.text || '')}</p>
            ${media ? `<div class="media">${media}</div>` : ''}
            <div class="post-stats">
              ${rt != null ? `<span>RT ${rt}</span>` : ''}
              ${fav != null ? `<span>いいね ${fav}</span>` : ''}
            </div>
          </a>
        `;
      }).join('');
    }
​
    function renderAll() {
      renderProfile(state.profile || {});
      renderPosts(state.posts || []);
      updatedLabel.textContent = formatFetchedAt(state.fetched_at);
    }
​
    async function refreshProfile(opts) {
      opts = opts || {};
      const silent = !!opts.silent;
      const username = (state.username || 'juufuuteiraden').replace(/^@/, '');
      refreshBtn.disabled = true;
      try {
        const res = await fetch('https://api.fxtwitter.com/' + encodeURIComponent(username), {
          headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error('http ' + res.status);
        const json = await res.json();
        if (!json || !json.user) throw new Error('no user');
        const u = json.user;
        state.profile = {
          name: u.name || state.profile.name,
          screen_name: u.screen_name || username,
          description: u.description || '',
          avatar_url: (u.avatar_url || '').replace('_normal', '_bigger'),
          banner_url: u.banner_url || '',
          url: u.url || ('https://x.com/' + username),
          followers: u.followers,
          tweets: u.tweets,
          website: u.website && u.website.url ? u.website.url : (u.website || null)
        };
        renderProfile(state.profile);
        if (!silent) showToast('プロフィールを更新しました');
      } catch (e) {
        if (!silent) showToast('プロフィール更新に失敗しました');
      } finally {
        refreshBtn.disabled = false;
      }
    }
​
    refreshBtn.addEventListener('click', function () { refreshProfile({ silent: false }); });
    renderAll();
    // 起動時は静かにプロフィールだけ最新化（失敗してもSEEDのまま）
    refreshProfile({ silent: true });
  </script>
